<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriWeek - Piano Settimanale, Ricettario & Spesa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        font-family: "DM Sans", sans-serif;
        color: #1b2521;
        background: #f2f5f1;
        font-synthesis: none;
      }
      body {
        min-width: 320px;
        min-height: 100vh;
        overflow-x: hidden;
        margin: 0;
      }
      button, input, textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      h1, h2, h3, p {
        margin: 0;
      }
      h1, h2, h3, .brand strong {
        font-family: "Manrope", sans-serif;
        letter-spacing: -0.035em;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: #bdc8c0 transparent;
      }
      .app-shell {
        min-height: 100vh;
        background: linear-gradient(145deg, #f7f8f5 0%, #edf2ef 55%, #f7f4ee 100%);
        position: relative;
        isolation: isolate;
      }
      .ambient {
        position: fixed;
        z-index: -1;
        border-radius: 999px;
        filter: blur(5px);
        opacity: 0.55;
        pointer-events: none;
      }
      .ambient-one {
        width: 38vw;
        height: 38vw;
        background: #dce9df;
        left: 25%;
        top: -20%;
      }
      .ambient-two {
        width: 30vw;
        height: 30vw;
        background: #e7e1d4;
        right: -8%;
        bottom: -14%;
      }
      .glass {
        background: rgba(248, 250, 248, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.85);
        box-shadow: 0 10px 35px rgba(44, 59, 51, 0.07), inset 0 1px rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
      }
      .topbar {
        height: 74px;
        position: sticky;
        top: 0;
        z-index: 30;
        display: grid;
        grid-template-columns: 320px 1fr auto;
        align-items: center;
        padding: 0 24px;
        border-width: 0 0 1px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .brand-mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        color: #f5f7f4;
        background: #243b31;
        border-radius: 12px;
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.2), 0 5px 14px rgba(36, 59, 49, 0.15);
      }
      .brand strong {
        display: block;
        font-size: 17px;
        line-height: 1.1;
      }
      .brand span {
        color: #7f8b85;
        display: block;
        font-size: 10px;
        margin-top: 3px;
      }
      .header-summary {
        justify-self: center;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #738079;
        font-size: 12px;
      }
      .header-summary strong {
        color: #26342e;
        font-size: 13px;
      }
      .header-summary i {
        width: 1px;
        height: 17px;
        background: #d3dad5;
      }
      .header-actions {
        display: flex;
        gap: 8px;
      }
      .btn {
        border: 0;
        border-radius: 11px;
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 15px;
        font-weight: 600;
        font-size: 13px;
        transition: 0.2s ease;
      }
      .btn:hover {
        transform: translateY(-1px);
      }
      .btn:disabled {
        opacity: 0.4;
        pointer-events: none;
      }
      .btn-ghost {
        background: rgba(255, 255, 255, 0.58);
        color: #55625c;
        border: 1px solid rgba(205, 214, 208, 0.7);
      }
      .btn-primary, .btn-dark {
        color: white;
        background: #263e34;
        box-shadow: 0 6px 15px rgba(38, 62, 52, 0.16);
      }
      .btn-danger {
        color: #a34e46;
        background: #f9eeec;
      }
      .btn-danger.solid {
        color: white;
        background: #a6534c;
      }
      .full {
        width: 100%;
      }
      .workspace {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        min-height: calc(100vh - 74px);
      }
      .sidebar {
        position: sticky;
        top: 74px;
        height: calc(100vh - 74px);
        border-width: 0 1px 0 0;
        padding: 25px 20px 20px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .sidebar-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        margin-bottom: 17px;
      }
      .eyebrow {
        color: #87938d;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 9px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .sidebar h2 {
        font-size: 21px;
      }
      .count-pill {
        background: #e7ece8;
        color: #617168;
        font-size: 11px;
        font-weight: 700;
        padding: 4px 9px;
        border-radius: 99px;
      }
      .search-box {
        min-height: 42px;
        border: 1px solid rgba(196, 206, 199, 0.75);
        background: rgba(255, 255, 255, 0.7);
        border-radius: 11px;
        margin-top: 12px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        gap: 8px;
        color: #8b9690;
      }
      .search-box input {
        width: 100%;
        min-width: 0;
        outline: 0;
        border: 0;
        background: transparent;
        font-size: 12px;
        color: #25322d;
      }
      .filter-row {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 12px 0 10px;
        flex: none;
      }
      .filter-row button {
        white-space: nowrap;
        border: 1px solid #d9dfdb;
        color: #728078;
        background: rgba(255, 255, 255, 0.55);
        font-size: 10px;
        font-weight: 600;
        border-radius: 99px;
        padding: 6px 9px;
      }
      .filter-row button.active {
        background: #dfe9e2;
        color: #345444;
        border-color: #c9d9ce;
      }
      .library-list {
        overflow-y: auto;
        padding: 2px 4px 30px 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .meal-card {
        background: rgba(255, 255, 255, 0.93);
        border: 1px solid rgba(255, 255, 255, 0.98);
        box-shadow: 0 6px 20px rgba(43, 57, 49, 0.075);
      }
      .library-card {
        border-radius: 15px;
        padding: 13px;
        cursor: grab;
      }
      .library-card:active {
        cursor: grabbing;
      }
      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 7px;
      }
      .meal-icon {
        width: 29px;
        height: 29px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        color: #597064;
        background: #eaf0eb;
      }
      .mini-action, .icon-btn {
        border: 0;
        background: transparent;
        color: #87928c;
        display: grid;
        place-items: center;
        border-radius: 9px;
      }
      .mini-action {
        width: 28px;
        height: 28px;
        opacity: 0;
        transition: 0.15s;
      }
      .library-card:hover .mini-action {
        opacity: 1;
      }
      .library-card h3 {
        font-size: 13px;
        line-height: 1.35;
        color: #202c27;
        padding-right: 5px;
      }
      .prep {
        display: flex;
        align-items: center;
        gap: 5px;
        color: #8a948f;
        font-size: 10px;
        margin: 5px 0 9px;
      }
      .macro-line {
        display: grid;
        grid-template-columns: 1.2fr repeat(3, 1fr);
        gap: 4px;
      }
      .macro-line span {
        padding: 5px 3px;
        text-align: center;
        border-radius: 6px;
        font-size: 8px;
        font-weight: 700;
        white-space: nowrap;
      }
      .macro-line .kcal {
        color: #83652e;
        background: #f4eddd;
      }
      .macro-line .protein {
        color: #4b725b;
        background: #e5eee7;
      }
      .macro-line .carbs {
        color: #526c7c;
        background: #e5edf1;
      }
      .macro-line .fats {
        color: #77647b;
        background: #eee8ef;
      }
      .tag-list {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        margin-top: 9px;
      }
      .tag-list span {
        color: #718079;
        background: #f1f3f1;
        border-radius: 99px;
        font-size: 8px;
        padding: 4px 7px;
      }
      .empty-library {
        text-align: center;
        color: #89948e;
        padding: 40px 10px;
        font-size: 12px;
        line-height: 1.6;
      }
      .planner {
        padding: 27px 26px 45px;
        min-width: 0;
        overflow-x: auto;
      }
      .planner-heading {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin-bottom: 19px;
      }
      .planner-heading h1 {
        font-size: 25px;
      }
      .week-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .week-stat {
        text-align: right;
      }
      .week-stat span {
        display: block;
        color: #89938e;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .week-stat strong {
        font-size: 12px;
      }
      .icon-btn {
        width: 38px;
        height: 38px;
        border: 1px solid rgba(207, 215, 210, 0.75);
        background: rgba(255, 255, 255, 0.55);
      }
      .week-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(135px, 1fr));
        gap: 9px;
        min-width: 1020px;
      }
      .day-column {
        min-width: 0;
      }
      .day-head {
        background: rgba(244, 247, 244, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 14px;
        padding: 12px 10px;
        margin-bottom: 9px;
      }
      .day-head > div:first-child {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 17px;
      }
      .day-head > div > span {
        font-family: "Manrope";
        color: #55635c;
        font-size: 10px;
        font-weight: 700;
      }
      .day-head b {
        display: flex;
        align-items: center;
        gap: 2px;
        font: 700 7px "DM Sans";
        color: #538063;
        background: #dfece2;
        padding: 3px 5px;
        border-radius: 99px;
      }
      .day-head-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin: 5px 0 4px;
      }
      .day-head > .day-head-row > strong {
        font-family: "Manrope";
        font-size: 16px;
      }
      .day-head > .day-head-row > strong small {
        color: #87928c;
        font: 500 8px "DM Sans";
      }
      .target-info {
        font-size: 8px;
        color: #819087;
        text-align: right;
      }
      .progress-container {
        width: 100%;
        background: #e2e8e3;
        height: 5px;
        border-radius: 99px;
        margin: 6px 0 8px;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        background: #538063;
        border-radius: 99px;
        transition: width 0.3s ease;
      }
      .day-macros {
        display: flex;
        justify-content: space-between;
        color: #728279;
        font-size: 8px;
        font-weight: 600;
      }
      .slot-wrap {
        margin-bottom: 10px;
      }
      .slot-label {
        display: block;
        color: #939c97;
        font-size: 8px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 700;
        margin: 0 0 5px 4px;
      }
      .empty-slot {
        width: 100%;
        min-height: 143px;
        border: 1px dashed #cbd4ce;
        background: rgba(255, 255, 255, 0.35);
        color: #9aa49e;
        border-radius: 13px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 9px;
        transition: 0.2s;
      }
      .empty-slot:hover {
        border-color: #8ca193;
        background: rgba(255, 255, 255, 0.65);
        color: #587064;
      }
      .empty-slot svg {
        padding: 4px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.8);
      }
      .planned-card {
        min-height: 143px;
        border-radius: 13px;
        padding: 10px;
        position: relative;
        cursor: grab;
        transition: opacity 0.2s, transform 0.2s;
        /* Rimosso overflow: hidden per evitare il taglio del badge completato */
        overflow: visible;
      }
      .planned-card:hover {
        transform: translateY(-1px);
      }
      .planned-card.completed {
        opacity: 0.62;
        background: rgba(240, 245, 241, 0.95);
        border: 1px solid rgba(109, 155, 120, 0.4);
      }
      .planned-card.completed h3 {
        text-decoration: line-through;
        text-decoration-color: #829a8c;
      }
      .planned-top {
        color: #929c97;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 8px;
        margin-bottom: 9px;
      }
      .planned-top span {
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .planned-top button {
        border: 0;
        background: transparent;
        color: #a0aaa4;
        padding: 0;
      }
      .planned-card h3 {
        font-size: 11px;
        line-height: 1.4;
        min-height: 46px;
        color: #22302a;
      }
      .macro-line.compact {
        grid-template-columns: 1fr 1fr;
      }
      .macro-line.compact span {
        font-size: 7px;
      }
      .complete-check {
        display: flex;
        gap: 5px;
        align-items: center;
        color: #7c8982;
        font-size: 7.5px;
        margin-top: 8px;
        cursor: pointer;
      }
      .complete-check input {
        position: absolute;
        opacity: 0;
      }
      .complete-check i {
        width: 14px;
        height: 14px;
        border: 1px solid #c7d1cb;
        border-radius: 4px;
        display: grid;
        place-items: center;
        color: transparent;
      }
      .complete-check input:checked + i {
        background: #658b70;
        border-color: #658b70;
        color: white;
      }
      .edit-card {
        position: absolute;
        right: 8px;
        bottom: 7px;
        border: 0;
        background: transparent;
        color: #9aa49e;
      }
      .complete-mark {
        position: absolute;
        right: 8px;
        top: 8px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #6b9476;
        color: white;
        display: grid;
        place-items: center;
        box-shadow: 0 2px 6px rgba(107, 148, 118, 0.35);
      }
      .mobile-day-picker, .mobile-nav, .fab {
        display: none;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 70;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(27, 36, 32, 0.32);
        backdrop-filter: blur(6px);
        animation: fade-in 0.18s ease;
      }
      .modal {
        width: min(480px, 100%);
        max-height: calc(100vh - 40px);
        overflow-y: auto;
        border-radius: 22px;
        padding: 23px;
        background: rgba(247, 249, 247, 0.92);
        box-shadow: 0 24px 70px rgba(30, 42, 35, 0.22), inset 0 1px white;
        animation: modal-in 0.2s ease;
      }
      .modal-wide {
        width: min(780px, 100%);
      }
      .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .modal-head h2 {
        font-size: 21px;
        line-height: 1.25;
      }
      .meal-form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .span-2 {
        grid-column: 1/-1;
      }
      .form-grid.five {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        grid-column: 1/-1;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        color: #4e5c55;
        font-size: 11px;
        font-weight: 600;
      }
      .field span small {
        color: #97a09b;
        font-weight: 400;
        margin-left: 4px;
      }
      .field input, .field textarea, .code-area {
        width: 100%;
        outline: 0;
        border: 1px solid #d8dfda;
        background: rgba(255, 255, 255, 0.8);
        color: #26332d;
        padding: 11px 12px;
        border-radius: 10px;
        font-size: 12px;
        resize: vertical;
      }
      .field input:focus, .field textarea:focus, .code-area:focus {
        border-color: #7e9b89;
        box-shadow: 0 0 0 3px rgba(106, 139, 118, 0.1);
      }
      .number-field > div {
        display: flex;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid #d8dfda;
        border-radius: 10px;
        align-items: center;
        overflow: hidden;
      }
      .number-field input {
        min-width: 0;
        border: 0;
        border-radius: 0;
        padding-right: 2px;
      }
      .number-field b {
        color: #9aa39e;
        font-size: 9px;
        padding-right: 8px;
      }
      .modal-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-top: 5px;
      }
      .modal-footer > div {
        display: flex;
        gap: 7px;
      }
      .sheet-handle {
        display: none;
      }
      .picker-list {
        max-height: 350px;
        overflow-y: auto;
        margin: 12px 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .picker-list button {
        border: 1px solid #e1e5e2;
        background: rgba(255, 255, 255, 0.75);
        border-radius: 11px;
        padding: 11px;
        text-align: left;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #7d8982;
      }
      .picker-list strong, .picker-list span {
        display: block;
      }
      .picker-list strong {
        color: #26332d;
        font-size: 12px;
      }
      .picker-list span {
        font-size: 10px;
        margin-top: 3px;
      }
      .action-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 18px;
      }
      .action-list button {
        display: grid;
        grid-template-columns: 38px 1fr auto;
        align-items: center;
        text-align: left;
        gap: 10px;
        padding: 10px;
        border: 0;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.75);
        color: #7e8a83;
      }
      .action-list button > i {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        background: #edf1ee;
        border-radius: 10px;
      }
      .action-list button > i.sage {
        background: #e2eee5;
        color: #5f8168;
      }
      .action-list button strong, .action-list button small {
        display: block;
      }
      .action-list button strong {
        color: #303c36;
        font-size: 12px;
      }
      .action-list button small {
        color: #8e9892;
        font-size: 9px;
        margin-top: 2px;
      }
      .action-list button.danger strong, .action-list button.danger > i {
        color: #a9544b;
      }
      .move-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
        max-height: 55vh;
        overflow-y: auto;
      }
      .move-grid button {
        border: 1px solid #dde3de;
        background: rgba(255, 255, 255, 0.75);
        border-radius: 10px;
        padding: 10px;
        text-align: left;
      }
      .move-grid button:disabled {
        opacity: 0.35;
      }
      .move-grid span, .move-grid strong {
        display: block;
      }
      .move-grid span {
        color: #819087;
        font-size: 9px;
        text-transform: uppercase;
      }
      .move-grid strong {
        font-size: 10px;
        color: #35423c;
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ai-title {
        display: flex;
        gap: 11px;
        align-items: center;
      }
      .tab-bar {
        display: grid;
        grid-template-columns: 1fr 1fr;
        padding: 4px;
        background: #e8ece9;
        border-radius: 12px;
        margin-bottom: 18px;
      }
      .tab-bar button {
        border: 0;
        background: transparent;
        border-radius: 9px;
        padding: 10px;
        color: #7b8780;
        font-size: 11px;
        font-weight: 700;
      }
      .tab-bar button.active {
        background: rgba(255, 255, 255, 0.92);
        color: #33453b;
        box-shadow: 0 2px 8px rgba(50, 60, 54, 0.07);
      }
      .info-banner {
        display: flex;
        gap: 12px;
        background: #e9f0eb;

    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;

      const initialShoppingList = [
        { id: "s1", name: "Tofu al naturale", category: "Frigo", checked: false },
        { id: "s2", name: "Riso basmati", category: "Dispensa", checked: false },
        { id: "s3", name: "Zucchine", category: "Verdura", checked: false },
        { id: "s4", name: "Quinoa", category: "Dispensa", checked: false },
        { id: "s5", name: "Tempeh", category: "Frigo", checked: true },
      ];

      function emptySchedule() {
        return Object.fromEntries(
          DAYS.flatMap((day) =>
            SLOTS.map((slot) => [`${day.key}_${slot}`, { mealId: null, completed: false }]),
          ),
        );
      }

      const initialState = {
        meals: initialMeals,
        schedule: {
          ...emptySchedule(),
          mon_lunch: { mealId: "meal-tofu-rice", completed: true },
          mon_dinner: { mealId: "meal-cashew-pasta", completed: false },
          tue_lunch: { mealId: "meal-quinoa-tempeh", completed: false },
          tue_dinner: { mealId: "meal-egg-spinach", completed: false },
          wed_lunch: { mealId: "meal-lentil-couscous", completed: false },
        },
        shoppingList: initialShoppingList,
      };

      function loadState() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "");
          if (Array.isArray(parsed.meals) && parsed.schedule)
            return {
              meals: parsed.meals,
              schedule: { ...emptySchedule(), ...parsed.schedule },
              shoppingList: Array.isArray(parsed.shoppingList) ? parsed.shoppingList : initialShoppingList
            };
        } catch {}
        return initialState;
      }

      function Icon({ name, size = 18 }) {
        const paths = {
          ai: (
            <>
              <path d="M12 3 9.8 8.8 4 11l5.8 2.2L12 19l2.2-5.8L20 11l-5.8-2.2L12 3Z" />
              <path d="m5 3-.7 1.7L2.5 5.5l1.8.8L5 8l.7-1.7 1.8-.8-1.8-.8L5 3Z" />
            </>
          ),
          arrow: (
            <>
              <path d="M5 12h14" />
              <path d="m14 7 5 5-5 5" />
            </>
          ),
          calendar: (
            <>
              <rect x="3" y="5" width="18" height="16" rx="3" />

            </>
          ),
          check: <path d="m5 12 4 4L19 6" />,
          chevron: <path d="m9 18 6-6-6-6" />,

            <>

            <>

          ),

          ),
          food: (
            <>
              <path d="M7 3v8M4 3v5c0 2 1.3 3 3 3s3-1 3-3V3M7 11v10" />

          ),
          cart: (
            <>
              <circle cx="9" cy="21" r="1" />
              <circle cx="20" cy="21" r="1" />

          ),

            </>
          ),
          spark: (
            <>
              <path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8" />
            </>
          ),
          trash: (
            <>
              <path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6" />
            </>
          ),
          undo: (
            <>
              <path d="m9 7-5 5 5 5" />
              <path d="M4 12h9a6 6 0 0 1 6 6" />
            </>
          ),
          x: <path d="m6 6 12 12M18 6 6 18" />,
        };
        return (
          <svg
            viewBox="0 0 24 24"
            width={size}
            height={size}
            fill="none"
            stroke="currentColor"
            strokeWidth="1.8"
            strokeLinecap="round"
            strokeLinejoin="round"
            aria-hidden
          >
            {paths[name]}
          </svg>
        );
      }

      function nutrition(meals) {
        return meals.reduce(
          (sum, meal) => ({
            kcal: sum.kcal + meal.kcal,
            protein: sum.protein + meal.protein,
            carbs: sum.carbs + meal.carbs,
            fats: sum.fats + meal.fats,
          }),
          { kcal: 0, protein: 0, carbs: 0, fats: 0 },
        );
      }

      function MacroLine({ meal, compact = false }) {
        return (
          <div className={`macro-line ${compact ? "compact" : ""}`}>
            <span className="kcal">{meal.kcal} kcal</span>
            <span className="protein">P {meal.protein}g</span>
            <span className="carbs">C {meal.carbs}g</span>
            <span className="fats">G {meal.fats}g</span>
          </div>
        );
      }

      const blankMeal = {
        title: "",
        kcal: 500,
        protein: 25,
        carbs: 55,
        fats: 18,
        prepTime: 20,
        ingredients: [],
        notes: "",
        tags: [],
      };

      function App() {
        const [state, setState] = useState(loadState);
        const [history, setHistory] = useState(() => {
          try {
            return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
          } catch {
            return [];
          }
        });
        const [query, setQuery] = useState("");
        const [tag, setTag] = useState("Tutti");
        const [selectedDay, setSelectedDay] = useState("mon");
        const [mobileTab, setMobileTab] = useState("plan"); // "plan" | "meals" | "shopping"
        const [mealModal, setMealModal] = useState(null);
        const [pickerSlot, setPickerSlot] = useState(null);
        const [actionSlot, setActionSlot] = useState(null);
        const [moveSlot, setMoveSlot] = useState(null);
        const [aiOpen, setAiOpen] = useState(false);
        const [resetOpen, setResetOpen] = useState(false);
        const [aiTab, setAiTab] = useState("export");
        const [importText, setImportText] = useState("");
        const [copyLabel, setCopyLabel] = useState("Copia prompt + dati");
        const [dragSource, setDragSource] = useState(null);

        useEffect(() => {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }, [state]);
        useEffect(() => {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        }, [history]);

        const commit = (updater) => {
          setState((current) => {
            setHistory((old) => [...old.slice(-4), current]);
            return updater(current);
          });
        };

        const undo = () => {
          const previous = history.at(-1);
          if (!previous) return;
          setState(previous);
          setHistory((old) => old.slice(0, -1));
        };

        const mealsById = useMemo(
          () => new Map(state.meals.map((meal) => [meal.id, meal])),
          [state.meals],
        );
        const allTags = useMemo(
          () => ["Tutti", ...new Set(state.meals.flatMap((meal) => meal.tags))],
          [state.meals],
        );
        const filteredMeals = state.meals.filter(
          (meal) =>
            (tag === "Tutti" || meal.tags.includes(tag)) &&
            `${meal.title} ${meal.ingredients.join(" ")}`.toLowerCase().includes(query.toLowerCase()),
        );

        const plannedMeals = (dayKey, completedOnly = false) =>
          Object.entries(state.schedule)
            .filter(
              ([key, value]) =>
                (!dayKey || key.startsWith(`${dayKey}_`)) &&
                value.mealId &&
                (!completedOnly || value.completed),
            )
            .map(([, value]) => mealsById.get(value.mealId))
            .filter(Boolean);
        const weekly = nutrition(plannedMeals());
        const assignedCount = plannedMeals().length;

        const assign = (slot, mealId) => {
          commit((current) => ({
            ...current,
            schedule: { ...current.schedule, [slot]: { mealId, completed: false } },
          }));
          setPickerSlot(null);
        };
        const toggleComplete = (slot) =>
          commit((current) => ({
            ...current,
            schedule: {
              ...current.schedule,
              [slot]: { ...current.schedule[slot], completed: !current.schedule[slot].completed },
            },
          }));
        const removeFromSlot = (slot) => {
          commit((current) => ({
            ...current,
            schedule: { ...current.schedule, [slot]: { mealId: null, completed: false } },
          }));
          setActionSlot(null);
        };
        const moveTo = (from, to) => {
          if (from === to) return;
          commit((current) => {
            const source = current.schedule[from];
            const target = current.schedule[to];
            return { ...current, schedule: { ...current.schedule, [from]: target, [to]: source } };
          });
          setActionSlot(null);
          setMoveSlot(null);
        };
        const onDrop = (target) => {
          if (!dragSource) return;
          if (dragSource.type === "meal") assign(target, dragSource.id);
          else moveTo(dragSource.id, target);
          setDragSource(null);
        };

        const saveMeal = (data, editingId) => {
          const meal = { ...data, id: editingId || `meal-${Date.now().toString(36)}` };
          commit((current) => ({
            ...current,
            meals: editingId
              ? current.meals.map((item) => (item.id === editingId ? meal : item))
              : [...current.meals, meal],
          }));
          setMealModal(null);
        };
        const deleteMeal = (id) => {
          commit((current) => ({
            meals: current.meals.filter((meal) => meal.id !== id),
            schedule: Object.fromEntries(
              Object.entries(current.schedule).map(([key, value]) => [
                key,
                value.mealId === id ? { mealId: null, completed: false } : value,
              ]),
            ),
          }));
          setMealModal(null);
        };

        const toggleShoppingItem = (id) => {
          commit((current) => ({
            ...current,
            shoppingList: current.shoppingList.map((item) =>
              item.id === id ? { ...item, checked: !item.checked } : item
            ),
          }));
        };

        const exportSchedule = Object.entries(state.schedule)
          .filter(([, value]) => value.mealId)
          .map(([key, value]) => {
            const [day, slot] = key.split("_");
            return {
              id: key,
              day,
              slot: slot === "lunch" ? "pranzo" : "cena",
              mealId: value.mealId,
              completed: value.completed,
            };
          });

        const exportJson = JSON.stringify({
          meals: state.meals,
          schedule: exportSchedule,
          shoppingList: state.shoppingList
        }, null, 2);

        const aiPrompt = `Agisci come assistente per la pianificazione nutrizionale e la spesa. Modifica i dati JSON seguenti secondo le mie indicazioni. Puoi aggiungere, modificare o rimuovere pasti, aggiornare gli slot settimanali e aggiornare/generare la lista della spesa (\`shoppingList\`) in base agli ingredienti dei pasti pianificati. REGOLE OBBLIGATORIE: mantieni gli id dei pasti esistenti; genera id univoci per i nuovi pasti; non modificare mai completed:true; rispetta esattamente lo schema; restituisci soltanto JSON valido, senza markdown o spiegazioni.

${exportJson}`;

        const parseImport = () => {
          if (!importText.trim()) return { error: "Incolla una risposta JSON per continuare." };
          try {
            const data = JSON.parse(importText);
            if (
              !data ||
              !Array.isArray(data.meals) ||
              (!Array.isArray(data.schedule) && typeof data.schedule !== "object")
            ) {
              return {
                error: "Schema non valido: sono richiesti meals (array) e schedule (array o oggetto).",
              };
            }
            for (const meal of data.meals) {
              if (
                !meal.id ||
                !meal.title ||
                ["kcal", "protein", "carbs", "fats", "prepTime"].some(
                  (key) => typeof meal[key] !== "number",
                )
              ) {
                return {
                  error: `Scheda pasto non valida: "${meal.title || meal.id || "senza nome"}".`,
                };
              }
            }
            const importedIds = new Set(data.meals.map((meal) => meal.id));
            const existing = new Map(state.meals.map((meal) => [meal.id, meal]));
            const added = data.meals.filter((meal) => !existing.has(meal.id)).length;
            const updated = data.meals.filter(
              (meal) =>
                existing.has(meal.id) && JSON.stringify(existing.get(meal.id)) !== JSON.stringify(meal),
            ).length;
            const removed = state.meals.filter((meal) => !importedIds.has(meal.id)).length;
            const preserved = Object.values(state.schedule).filter((slot) => slot.completed).length;
            const shoppingCount = Array.isArray(data.shoppingList) ? data.shoppingList.length : 0;
            return { data, added, updated, removed, preserved, shoppingCount };
          } catch {
            return { error: "JSON non valido: controlla parentesi, virgole e virgolette." };
          }
        };
        const importPreview = parseImport();

        const applyImport = () => {
          const result = parseImport();
          if (result.error) return;
          const incoming = result.data;
          commit((current) => {
            const normalized = { ...emptySchedule() };
            const inputEntries = Array.isArray(incoming.schedule)
              ? incoming.schedule.map(
                  (item) => [
                    item.id || `${item.day}_${item.slot === "pranzo" ? "lunch" : "dinner"}`,
                    { mealId: item.mealId, completed: Boolean(item.completed) },
                  ],
                )
              : Object.entries(incoming.schedule);
            const incomingKeys = new Set(inputEntries.map(([key]) => key));
            for (const [key, value] of inputEntries) if (key in normalized) normalized[key] = value;
            for (const [key, oldValue] of Object.entries(current.schedule)) {
              if (
                oldValue.completed &&
                (!incomingKeys.has(key) || normalized[key]?.mealId === oldValue.mealId)
              )
                normalized[key] = oldValue;
            }
            const validIds = new Set(incoming.meals.map((meal) => meal.id));
            for (const key of Object.keys(normalized))
              if (normalized[key].mealId && !validIds.has(normalized[key].mealId))
                normalized[key] = { mealId: null, completed: false };
            return {
              meals: incoming.meals.map((meal) => ({
                ...meal,
                ingredients: meal.ingredients || [],
                tags: meal.tags || [],
                notes: meal.notes || "",
              })),
              schedule: normalized,
              shoppingList: Array.isArray(incoming.shoppingList) ? incoming.shoppingList : current.shoppingList
            };
          });
          setAiOpen(false);
          setImportText("");
        };

        const copyPrompt = async () => {
          await navigator.clipboard.writeText(aiPrompt);
          setCopyLabel("Copiato!");
          window.setTimeout(() => setCopyLabel("Copia prompt + dati"), 1600);
        };

        return (
          <div className="app-shell">
            <div className="ambient ambient-one" />
            <div className="ambient ambient-two" />
            <header className="topbar glass">
              <div className="brand">
                <div className="brand-mark">
                  <Icon name="food" size={20} />
                </div>
                <div>
                  <strong>NutriWeek</strong>
                  <span>Il tuo ritmo, il tuo benessere</span>
                </div>
              </div>
              <div className="header-summary">
                <span>Media giornaliera</span>
                <strong>{Math.round(weekly.kcal / 7).toLocaleString("it-IT")} kcal</strong>
                <i />
                <span>{assignedCount}/14 pasti pianificati</span>
              </div>
              <div className="header-actions">
                <button className="btn btn-ghost" disabled={!history.length} onClick={undo}>
                  <Icon name="undo" />
                  <span>Annulla</span>
                </button>
                <button className="btn btn-primary" onClick={() => setAiOpen(true)}>
                  <Icon name="ai" />
                  <span>AI Sync</span>
                </button>
              </div>
            </header>

            <div className="workspace">
              {/* SIDEBAR ARCHIVIO */}
              <aside className={`sidebar glass ${mobileTab === "meals" ? "mobile-active" : ""}`}>
                <div className="sidebar-head">
                  <div>
                    <p className="eyebrow">La tua raccolta</p>
                    <h2>Archivio pasti</h2>
                  </div>
                  <span className="count-pill">{state.meals.length}</span>
                </div>
                <button className="btn btn-dark full" onClick={() => setMealModal({})}>
                  <Icon name="plus" /> Nuovo pasto
                </button>
                <label className="search-box">
                  <Icon name="search" />
                  <input
                    value={query}
                    onChange={(e) => setQuery(e.target.value)}
                    placeholder="Cerca pasti o ingredienti..."
                  />
                </label>
                <div className="filter-row">
                  {allTags.map((item) => (
                    <button
                      key={item}
                      className={tag === item ? "active" : ""}
                      onClick={() => setTag(item)}
                    >
                      {item}
                    </button>
                  ))}
                </div>
                <div className="library-list">
                  {filteredMeals.map((meal) => (
                    <LibraryCard
                      key={meal.id}
                      meal={meal}
                      onEdit={() => setMealModal({ meal })}
                      onDrag={() => setDragSource({ type: "meal", id: meal.id })}
                    />
                  ))}
                  {!filteredMeals.length && (
                    <div className="empty-library">
                      Nessun pasto trovato.
                      <br />
                      Prova un altro filtro.
                    </div>
                  )}
                </div>
              </aside>

              {/* PLANNER SETTIMANALE */}
              <main className={`planner ${mobileTab === "plan" ? "mobile-active" : ""}`}>
                <div className="planner-heading">
                  <div>
                    <p className="eyebrow">Piano settimanale</p>
                    <h1>La tua settimana</h1>
                  </div>
                  <div className="week-actions">
                    <div className="week-stat">
                      <span>Totale piano</span>
                      <strong>{weekly.kcal.toLocaleString("it-IT")} kcal</strong>
                    </div>
                    <button
                      className="icon-btn"
                      title="Resetta settimana"
                      onClick={() => setResetOpen(true)}
                    >
                      <Icon name="trash" />
                    </button>
                  </div>
                </div>

                <div className="mobile-day-picker">
                  {DAYS.map((day) => {
                    const dayTotal = nutrition(plannedMeals(day.key));
                    return (
                      <button
                        key={day.key}
                        className={selectedDay === day.key ? "active" : ""}
                        onClick={() => setSelectedDay(day.key)}
                      >
                        <span>{day.short}</span>
                        <i>{dayTotal.kcal || "—"}</i>
                      </button>
                    );
                  })}
                </div>

                <div className="week-grid">
                  {DAYS.map((day) => {
                    const total = nutrition(plannedMeals(day.key));
                    const done =
                      state.schedule[`${day.key}_lunch`].completed &&
                      state.schedule[`${day.key}_dinner`].completed;
                    const kcalPercent = Math.min(100, Math.round((total.kcal / DAILY_TARGETS.kcal) * 100));
                    return (
                      <section
                        key={day.key}
                        className={`day-column ${selectedDay === day.key ? "selected" : ""}`}
                      >
                        <div className="day-head">
                          <div>
                            <span>{day.label}</span>
                            {done && (
                              <b>
                                <Icon name="check" size={12} /> Completo
                              </b>
                            )}
                          </div>
                          <div className="day-head-row">
                            <strong>
                              {total.kcal}
                              <small> / {DAILY_TARGETS.kcal} kcal</small>
                            </strong>
                            <span className="target-info">{kcalPercent}%</span>
                          </div>
                          <div className="progress-container">
                            <div className="progress-bar" style={{ width: `${kcalPercent}%` }} />
                          </div>
                          <div className="day-macros">
                            <span>P {total.protein}g/{DAILY_TARGETS.protein}g</span>
                            <span>C {total.carbs}g/{DAILY_TARGETS.carbs}g</span>
                            <span>G {total.fats}g/{DAILY_TARGETS.fats}g</span>
                          </div>
                        </div>
                        {SLOTS.map((slot) => {
                          const key = `${day.key}_${slot}`;
                          const value = state.schedule[key];
                          const meal = value.mealId ? mealsById.get(value.mealId) : undefined;
                          return (
                            <div className="slot-wrap" key={key}>
                              <span className="slot-label">{slot === "lunch" ? "Pranzo" : "Cena"}</span>
                              {meal ? (
                                <PlannedCard
                                  meal={meal}
                                  completed={value.completed}
                                  onToggle={() => toggleComplete(key)}
                                  onRemove={() => removeFromSlot(key)}
                                  onEdit={() => setMealModal({ meal })}
                                  onAction={() => setActionSlot(key)}
                                  onDrag={() => setDragSource({ type: "slot", id: key })}
                                  onDrop={() => onDrop(key)}
                                />
                              ) : (
                                <button
                                  className="empty-slot"
                                  onClick={() => setPickerSlot(key)}
                                  onDragOver={(e) => e.preventDefault()}
                                  onDrop={() => onDrop(key)}
                                >
                                  <Icon name="plus" />
                                  <span>Aggiungi pasto</span>
                                </button>
                              )}
                            </div>
                          );
                        })}
                      </section>
                    );
                  })}
                </div>
              </main>

              {/* LISTA DELLA SPESA (VISTA DESKTOP/MOBILE) */}
              <div className={`planner ${mobileTab === "shopping" ? "mobile-active" : ""}`} style={{ display: mobileTab === "shopping" ? "block" : undefined }}>
                <div className="planner-heading desktop-only">
                  <div>
                    <p className="eyebrow">Approvvigionamento</p>
                    <h1>Lista della spesa</h1>
                  </div>
                  <button className="btn btn-primary" onClick={() => setAiOpen(true)}>
                    <Icon name="ai" /> Aggiorna con IA
                  </button>
                </div>
                <div className="glass" style={{ padding: "24px", borderRadius: "20px", marginTop: mobileTab === "shopping" ? "10px" : "0" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "16px" }}>
                    <div>
                      <h3 style={{ fontSize: "17px" }}>Ingredienti necessari</h3>
                      <p style={{ fontSize: "11px", color: "#738079" }}>Gestiti dal tuo piano e aggiornati dall'IA</p>
                    </div>
                    <span className="count-pill">{state.shoppingList.filter(i => !i.checked).length} da comprare</span>
                  </div>
                  <div className="shopping-container">
                    {state.shoppingList.map((item) => (
                      <div key={item.id} className={`shopping-item ${item.checked ? "checked" : ""}`}>
                        <div className="shopping-left" onClick={() => toggleShoppingItem(item.id)}>
                          <input type="checkbox" checked={item.checked} onChange={() => toggleShoppingItem(item.id)} />
                          <span style={{ fontSize: "13px", fontWeight: "600", color: "#25322d" }}>{item.name}</span>
                        </div>
                        <span className="shopping-cat">{item.category}</span>
                      </div>
                    ))}
                    {!state.shoppingList.length && (
                      <div className="empty-library">
                        La lista della spesa è vuota.<br />Usa l'IA Sync per generarla in base ai tuoi pasti!
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>

            {/* NAVIGAZIONE MOBILE */}
            <nav className="mobile-nav glass">
              <button
                className={mobileTab === "plan" ? "active" : ""}
                onClick={() => setMobileTab("plan")}
              >
                <Icon name="calendar" />
                <span>Settimana</span>
              </button>
              <button
                className={mobileTab === "meals" ? "active" : ""}
                onClick={() => setMobileTab("meals")}
              >
                <Icon name="food" />
                <span>Archivio</span>
              </button>
              <button
                className={mobileTab === "shopping" ? "active" : ""}
                onClick={() => setMobileTab("shopping")}
              >
                <Icon name="cart" />
                <span>Spesa</span>
              </button>
            </nav>
            <button
              className="fab"
              onClick={() => {
                if (mobileTab === "plan") setMobileTab("meals");
                else if (mobileTab === "meals") setMobileTab("shopping");
                else setMealModal({});
              }}
            >
              <Icon name="plus" size={22} />
            </button>

            {mealModal && (
              <MealEditor
                context={mealModal}
                onClose={() => setMealModal(null)}
                onSave={saveMeal}
                onDelete={deleteMeal}
                onDuplicate={(meal) => setMealModal({ meal, duplicate: true })}
              />
            )}
            {pickerSlot && (
              <MealPicker
                meals={state.meals}
                slot={pickerSlot}
                onClose={() => setPickerSlot(null)}
                onPick={(id) => assign(pickerSlot, id)}
                onCreate={() => {
                  setPickerSlot(null);
                  setMealModal({});
                }}
              />
            )}
            {actionSlot && state.schedule[actionSlot]?.mealId && (
              <ActionSheet
                meal={mealsById.get(state.schedule[actionSlot].mealId)}
                completed={state.schedule[actionSlot].completed}
                onClose={() => setActionSlot(null)}
                onComplete={() => {
                  toggleComplete(actionSlot);
                  setActionSlot(null);
                }}
                onMove={() => setMoveSlot(actionSlot)}
                onEdit={() => {
                  setMealModal({ meal: mealsById.get(state.schedule[actionSlot].mealId) });
                  setActionSlot(null);
                }}
                onRemove={() => removeFromSlot(actionSlot)}
              />
            )}
            {moveSlot && (
              <MoveSheet
                from={moveSlot}
                schedule={state.schedule}
                meals={mealsById}
                onClose={() => setMoveSlot(null)}
                onMove={(to) => moveTo(moveSlot, to)}
              />
            )}
            {aiOpen && (
              <AiModal
                tab={aiTab}
                setTab={setAiTab}
                prompt={aiPrompt}
                importText={importText}
                setImportText={setImportText}
                preview={importPreview}
                onCopy={copyPrompt}
                copyLabel={copyLabel}
                onImport={applyImport}
                onClose={() => setAiOpen(false)}
              />
            )}
            {resetOpen && (
              <ConfirmModal
                title="Svuotare la settimana?"
                text="Le schede nell’archivio resteranno al sicuro. Potrai annullare questa azione."
                onClose={() => setResetOpen(false)}
                onConfirm={() => {
                  commit((current) => ({ ...current, schedule: emptySchedule() }));
                  setResetOpen(false);
                }}
              />
            )}
          </div>
        );
      }

      function LibraryCard({ meal, onEdit, onDrag }) {
        return (
          <article className="library-card meal-card" draggable onDragStart={onDrag}>
            <div className="card-top">
              <div className="meal-icon">
                <Icon name="food" size={17} />
              </div>
              <button className="mini-action" onClick={onEdit} aria-label={`Modifica ${meal.title}`}>
                <Icon name="edit" size={15} />
              </button>
            </div>
            <h3>{meal.title}</h3>
            <div className="prep">
              <Icon name="clock" size={14} /> {meal.prepTime} min
            </div>
            <MacroLine meal={meal} />
            <div className="tag-list">
              {meal.tags.map((item) => (
                <span key={item}>{item}</span>
              ))}
            </div>
          </article>
        );
      }

      function PlannedCard({
        meal,
        completed,
        onToggle,
        onRemove,
        onEdit,
        onAction,
        onDrag,
        onDrop,
      }) {
        return (
          <article
            className={`planned-card meal-card ${completed ? "completed" : ""}`}
            draggable
            onDragStart={onDrag}
            onDragOver={(e) => e.preventDefault()}
            onDrop={onDrop}
            onClick={onAction}
          >
            <div className="planned-top">
              <span>
                <Icon name="clock" size={12} /> {meal.prepTime} min
              </span>
              <button
                className="desktop-only"
                onClick={(e) => {
                  e.stopPropagation();
                  onRemove();
                }}
              >
                <Icon name="x" size={14} />
              </button>
            </div>
            <h3>{meal.title}</h3>
            <MacroLine meal={meal} compact />
            <label className="complete-check desktop-only" onClick={(e) => e.stopPropagation()}>
              <input type="checkbox" checked={completed} onChange={onToggle} />
              <i>
                <Icon name="check" size={12} />
              </i>
              <span>{completed ? "Completato" : "Segna completato"}</span>
            </label>
            <button
              className="edit-card desktop-only"
              onClick={(e) => {
                e.stopPropagation();
                onEdit();
              }}
              aria-label="Modifica"
            >
              <Icon name="edit" size={13} />
            </button>
            {completed && (
              <div className="complete-mark">
                <Icon name="check" size={12} />
              </div>
            )}
          </article>
        );
      }

      function ModalFrame({ children, onClose, wide = false, sheet = false }) {
        return (
          <div className="modal-backdrop" onMouseDown={onClose}>
            <div
              className={`modal glass ${wide ? "modal-wide" : ""} ${sheet ? "bottom-sheet" : ""}`}
              onMouseDown={(e) => e.stopPropagation()}
            >
              {children}
            </div>
          </div>
        );
      }

      function MealEditor({ context, onClose, onSave, onDelete, onDuplicate }) {
        const source = context.meal;
        const [form, setForm] = useState(source ? { ...source } : blankMeal);
        const set = (key, value) => setForm((old) => ({ ...old, [key]: value }));
        return (
          <ModalFrame onClose={onClose} wide>
            <div className="modal-head">
              <div>
                <p className="eyebrow">Scheda pasto</p>
                <h2>{context.duplicate ? "Duplica pasto" : source ? "Modifica pasto" : "Nuovo pasto"}</h2>
              </div>
              <button className="icon-btn" onClick={onClose}>
                <Icon name="x" />
              </button>
            </div>
            <form
              className="meal-form"
              onSubmit={(e) => {
                e.preventDefault();
                onSave(form, source && !context.duplicate ? source.id : undefined);
              }}
            >
              <label className="field span-2">
                <span>Nome del piatto</span>
                <input
                  required
                  value={form.title}
                  onChange={(e) => set("title", e.target.value)}
                  placeholder="Es. Curry di ceci e verdure"
                />
              </label>
              <div className="form-grid five">
                {[
                  ["prepTime", "Tempo", "min"],
                  ["kcal", "Energia", "kcal"],
                  ["protein", "Proteine", "g"],
                  ["carbs", "Carboidrati", "g"],
                  ["fats", "Grassi", "g"],
                ].map(([key, label, unit]) => (
                  <label className="field number-field" key={key}>
                    <span>{label}</span>
                    <div>
                      <input
                        type="number"
                        min="0"
                        required
                        value={form[key]}
                        onChange={(e) => set(key, Number(e.target.value))}
                      />
                      <b>{unit}</b>
                    </div>
                  </label>
                ))}
              </div>
              <label className="field">
                <span>
                  Ingredienti <small>uno per riga</small>
                </span>
                <textarea
                  rows={4}
                  value={form.ingredients.join("\n")}
                  onChange={(e) => set("ingredients", e.target.value.split("\n").filter(Boolean))}
                  placeholder={"Ceci\nRiso basmati\nSpinaci"}
                />
              </label>
              <label className="field">
                <span>Note di preparazione</span>
                <textarea
                  rows={4}
                  value={form.notes}
                  onChange={(e) => set("notes", e.target.value)}
                  placeholder="Procedimento, consigli o varianti..."
                />
              </label>
              <label className="field span-2">
                <span>
                  Tag <small>separati da virgola</small>
                </span>
                <input
                  value={form.tags.join(", ")}
                  onChange={(e) =>
                    set(
                      "tags",
                      e.target.value
                        .split(",")
                        .map((item) => item.trim())
                        .filter(Boolean),
                    )
                  }
                  placeholder="Proteico, Veloce, Senza lattosio"
                />
              </label>
              <div className="modal-footer span-2">
                <div>
                  {source && !context.duplicate && (
                    <>
                      <button
                        type="button"
                        className="btn btn-danger"
                        onClick={() => onDelete(source.id)}
                      >
                        <Icon name="trash" /> Elimina
                      </button>
                      <button type="button" className="btn btn-ghost" onClick={() => onDuplicate(source)}>
                        <Icon name="copy" /> Duplica
                      </button>
                    </>
                  )}
                </div>
                <div>
                  <button type="button" className="btn btn-ghost" onClick={onClose}>
                    Annulla
                  </button>
                  <button type="submit" className="btn btn-primary">
                    Salva pasto
                  </button>
                </div>
              </div>
            </form>
          </ModalFrame>
        );
      }

      function MealPicker({ meals, slot, onClose, onPick, onCreate }) {
        const [query, setQuery] = useState("");
        const label = slot.endsWith("lunch") ? "pranzo" : "cena";
        return (
          <ModalFrame onClose={onClose} sheet>
            <div className="sheet-handle" />
            <div className="modal-head">
              <div>
                <p className="eyebrow">Aggiungi al {label}</p>
                <h2>Scegli un pasto</h2>
              </div>
              <button className="icon-btn" onClick={onClose}>
                <Icon name="x" />
              </button>
            </div>
            <label className="search-box">
              <Icon name="search" />
              <input
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="Cerca nell’archivio..."
              />
            </label>
            <div className="picker-list">
              {meals
                .filter((meal) => meal.title.toLowerCase().includes(query.toLowerCase()))
                .map((meal) => (
                  <button key={meal.id} onClick={() => onPick(meal.id)}>
                    <div>
                      <strong>{meal.title}</strong>
                      <span>
                        {meal.prepTime} min · {meal.kcal} kcal
                      </span>
                    </div>
                    <Icon name="chevron" />
                  </button>
                ))}
            </div>
            <button className="btn btn-dark full" onClick={onCreate}>
              <Icon name="plus" /> Crea un nuovo pasto
            </button>
          </ModalFrame>
        );
      }

      function ActionSheet({
        meal,
        completed,
        onClose,
        onComplete,
        onMove,
        onEdit,
        onRemove,
      }) {
        return (
          <ModalFrame onClose={onClose} sheet>
            <div className="sheet-handle" />
            <div className="modal-head">
              <div>
                <p className="eyebrow">Azioni rapide</p>
                <h2>{meal.title}</h2>
              </div>
              <button className="icon-btn" onClick={onClose}>
                <Icon name="x" />
              </button>
            </div>
            <MacroLine meal={meal} />
            <div className="action-list">
              <button onClick={onComplete}>
                <i className="sage">
                  <Icon name="check" />
                </i>
                <span>
                  <strong>{completed ? "Segna da completare" : "Segna come completato"}</strong>
                  <small>Aggiorna i progressi del piano</small>
                </span>
                <Icon name="chevron" />
              </button>
              <button onClick={onMove}>
                <i>
                  <Icon name="arrow" />
                </i>
                <span>
                  <strong>Sposta o scambia</strong>
                  <small>Scegli un altro giorno o pasto</small>
                </span>
                <Icon name="chevron" />
              </button>
              <button onClick={onEdit}>
                <i>
                  <Icon name="edit" />
                </i>
                <span>
                  <strong>Modifica scheda</strong>
                  <small>Aggiorna dettagli e nutrienti</small>
                </span>
                <Icon name="chevron" />
              </button>
              <button className="danger" onClick={onRemove}>
                <i>
                  <Icon name="trash" />
                </i>
                <span>
                  <strong>Rimuovi dal piano</strong>
                  <small>La scheda resta nell’archivio</small>
                </span>
                <Icon name="chevron" />
              </button>
            </div>
          </ModalFrame>
        );
      }

      function MoveSheet({ from, schedule, meals, onClose, onMove }) {
        return (
          <ModalFrame onClose={onClose} sheet>
            <div className="sheet-handle" />
            <div className="modal-head">
              <div>
                <p className="eyebrow">Sposta o scambia</p>
                <h2>Scegli uno slot</h2>
              </div>
              <button className="icon-btn" onClick={onClose}>
                <Icon name="x" />
              </button>
            </div>
            <div className="move-grid">
              {DAYS.flatMap((day) =>
                SLOTS.map((slot) => {
                  const key = `${day.key}_${slot}`;
                  const meal = schedule[key].mealId ? meals.get(schedule[key].mealId) : undefined;
                  return (
                    <button key={key} disabled={key === from} onClick={() => onMove(key)}>
                      <span>
                        {day.short} · {slot === "lunch" ? "Pranzo" : "Cena"}
                      </span>
                      <strong>{meal?.title || "Slot libero"}</strong>
                    </button>
                  );
                }),
              )}
            </div>
          </ModalFrame>
        );
      }

      function AiModal({
        tab,
        setTab,
        prompt,
        importText,
        setImportText,
        preview,
        onCopy,
        copyLabel,
        onImport,
        onClose,
      }) {
        return (
          <ModalFrame onClose={onClose} wide>
            <div className="modal-head">
              <div className="ai-title">
                <div className="brand-mark">
                  <Icon name="ai" />
                </div>
                <div>
                  <p className="eyebrow">Assistente esterno</p>
                  <h2>AI Sync</h2>
                </div>
              </div>
              <button className="icon-btn" onClick={onClose}>
                <Icon name="x" />
              </button>
            </div>
            <div className="tab-bar">
              <button className={tab === "export" ? "active" : ""} onClick={() => setTab("export")}>
                1. Esporta dati & Spesa
              </button>
              <button className={tab === "import" ? "active" : ""} onClick={() => setTab("import")}>
                2. Importa da AI
              </button>
            </div>
            {tab === "export" ? (
              <div className="ai-panel">
                <div className="info-banner">
                  <Icon name="spark" />
                  <div>
                    <strong>Pronto per il tuo assistente AI</strong>
                    <p>
                      Copia il prompt con ricettario, piano e lista spesa. Chiedi all'IA di aggiornare i pasti o generare la spesa.
                    </p>
                  </div>
                </div>
                <label className="field">
                  <span>Prompt + stato attuale (incluso shoppingList)</span>
                  <textarea className="code-area" readOnly value={prompt} rows={13} />
                </label>
                <div className="modal-footer">
                  <span className="privacy-note">I dati restano nel tuo browser finché non li copi.</span>
                  <button className="btn btn-primary" onClick={onCopy}>
                    <Icon name="copy" /> {copyLabel}
                  </button>
                </div>
              </div>
            ) : (
              <div className="ai-panel">
                <div className="import-instructions">
                  <strong>Incolla qui la risposta JSON</strong>
                  <span>Controlleremo formato, ricette e lista della spesa prima di applicarle.</span>
                </div>
                <textarea
                  className={`code-area import-area ${importText && preview.error ? "invalid" : ""}`}
                  value={importText}
                  onChange={(e) => setImportText(e.target.value)}
                  rows={11}
                  placeholder={'{\n  "meals": [...],\n  "schedule": [...],\n  "shoppingList": [...]\n}'}
                />
                {importText &&
                  (preview.error ? (
                    <div className="validation-error">
                      <Icon name="x" />
                      {preview.error}
                    </div>
                  ) : (
                    <div className="merge-preview">
                      <div>
                        <span>Nuovi pasti</span>
                        <strong>+{preview.added}</strong>
                      </div>
                      <div>
                        <span>Aggiornati</span>
                        <strong>{preview.updated}</strong>
                      </div>
                      <div>
                        <span>Spesa</span>
                        <strong>{preview.shoppingCount} voci</strong>
                      </div>
                      <div className="preserved">
                        <span>Progressi</span>
                        <strong>
                          <Icon name="check" /> {preview.preserved}
                        </strong>
                      </div>
                    </div>
                  ))}
                <div className="modal-footer">
                  <span className="privacy-note">Verrà creato automaticamente uno snapshot Undo.</span>
                  <button
                    className="btn btn-primary"
                    disabled={!importText || preview.error}
                    onClick={onImport}
                  >
                    <Icon name="spark" /> Applica Smart Merge
                  </button>
                </div>
              </div>
            )}
          </ModalFrame>
        );
      }

      function ConfirmModal({ title, text, onClose, onConfirm }) {
        return (
          <ModalFrame onClose={onClose}>
            <div className="confirm-icon">
              <Icon name="trash" />
            </div>
            <h2>{title}</h2>
            <p className="confirm-text">{text}</p>
            <div className="confirm-actions">
              <button className="btn btn-ghost" onClick={onClose}>
                Annulla
              </button>
              <button className="btn btn-danger solid" onClick={onConfirm}>
                Svuota piano
              </button>
            </div>
          </ModalFrame>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
